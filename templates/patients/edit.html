<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Patient</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="header">
    <h1>Hospital Management System</h1>
    <p>Patient Management</p>
</header>

<main class="container">

    <h2>Edit Patient</h2>

    <form method="POST">

        <label>Patient Name</label>
        <input type="text" name="name"
               value="{{ patient.name }}" required>

        <br><br>

        <label>Age</label>
        <input type="number" name="age"
               value="{{ patient.age }}"
               min="1" max="120" required>

        <br><br>

        <label>Gender</label>
        <select name="gender" required>
            <option value="Male"
                {% if patient.gender == "Male" %}selected{% endif %}>
                Male
            </option>

            <option value="Female"
                {% if patient.gender == "Female" %}selected{% endif %}>
                Female
            </option>

            <option value="Other"
                {% if patient.gender == "Other" %}selected{% endif %}>
                Other
            </option>
        </select>

        <br><br>

        <label>Phone</label>
        <input type="tel" name="phone"
               value="{{ patient.phone }}" required>

        <br><br>

        <label>Address</label>
        <textarea name="address">{{ patient.address }}</textarea>

        <br><br>

        <label>Disease</label>
        <input type="text" name="disease"
               value="{{ patient.disease }}">

        <br><br>

        <button type="submit">Update Patient</button>

        <a href="/patients">Cancel</a>

    </form>

</main>

</body>
</html>
